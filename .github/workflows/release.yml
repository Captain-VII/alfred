name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: PyInstaller + Inno Setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Vérifier que la version du tag correspond au package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $pkg = python -c "import alfred; print(alfred.__version__)"
          if ($tag -ne $pkg) { throw "Tag $tag != alfred.__version__ $pkg" }

      - name: Tests
        run: pytest -q

      - name: Build PyInstaller (onedir)
        run: python scripts/build.py --skip-installer

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compiler l'installeur
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$version installer\alfred.iss

      - name: Extraire les notes du CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?s)## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=\n## \[|\z)"
          $m = [regex]::Match($content, $pattern)
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Voir CHANGELOG.md" }
          Set-Content -Path release_notes.md -Value $body -Encoding utf8

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          name: Alfred ${{ github.ref_name }}
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            installer/Output/Alfred-Setup-*.exe
