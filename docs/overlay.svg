<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2d33"/>
      <stop offset="1" stop-color="#15161a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- bureau -->
  <rect width="640" height="300" fill="url(#bg)"/>
  <!-- overlay -->
  <g filter="url(#shadow)">
    <rect x="60" y="60" width="520" height="150" rx="14" fill="#1e1f24" stroke="#3a3b42"/>
  </g>
  <text x="80" y="90" fill="#c9a227" font-size="12" font-weight="600" letter-spacing="1">ALFRED</text>
  <text x="80" y="122" fill="#f2f2f2" font-size="15">ouvre spotify et monte le son</text>
  <text x="80" y="152" fill="#9a9ca6" font-size="14" font-style="italic">Spotify est ouvert. Volume à soixante pour cent.</text>
  <text x="80" y="188" fill="#6f7178" font-size="11" font-family="Cascadia Mono, Consolas, monospace">niveau 1 · open_app · route 0 ms · tool 41 ms · total 58 ms</text>
  <!-- légende -->
  <text x="60" y="250" fill="#9a9ca6" font-size="12">Ctrl + Espace → parler · Ctrl + Maj + Espace → taper · Échap → annuler</text>
  <text x="60" y="272" fill="#6f7178" font-size="11">Overlay frameless, always-on-top, sur l'écran du curseur. Thème suit Windows.</text>
</svg>
